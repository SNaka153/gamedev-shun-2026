<script>

// ==========================================
// NEW METHOD 2: ATBASH CIPHER
// Reverse the alphabet: a = z, b = y
// ==========================================

function myAtbash(myText) {

  let myAlphabet = 'abcdefghijklmnopqrstuvwxyz'
  let myString = myText.split('')

  for (let myLoop = 0; myLoop < myString.length; myLoop++) {

    let myOriginal = myString[myLoop]
    let myLower = myOriginal.toLowerCase()

    let myPosition = myAlphabet.indexOf(myLower)

    // Only change alphabet letters
    if (myPosition !== -1) {

      let myNewPosition = 25 - myPosition
      let myTemp = myAlphabet[myNewPosition]

      // Keep uppercase letters
      if (myOriginal !== myLower) {
        myTemp = myTemp.toUpperCase()
      }

      myString[myLoop] = myTemp
    }
  }

  return myString.join('')
}


function myAtbashEncrypt() {

  let myText = document.getElementById('myArea01').value

  document.getElementById('myArea02').value = myAtbash(myText)
  document.getElementById('myArea03').value = ''

}


function myAtbashDecrypt() {

  let myText = document.getElementById('myArea02').value

  document.getElementById('myArea03').value = myAtbash(myText)

}


// ==========================================
// NEW METHOD 3: KEYWORD CIPHER
// Uses a different shift for each letter
// ==========================================

function myKeywordChange(myText, myDirection) {

  let myAlphabet = 'abcdefghijklmnopqrstuvwxyz'

  let myKey = document.getElementById('myKey').value
    .toLowerCase()
    .replace(/[^a-z]/g, '')

  // Check that the keyword is valid
  if (myKey.length === 0) {
    alert('Please enter a keyword using A-Z letters.')
    return null
  }

  let myString = myText.split('')
  let myKeyLoop = 0

  for (let myLoop = 0; myLoop < myString.length; myLoop++) {

    let myOriginal = myString[myLoop]
    let myLower = myOriginal.toLowerCase()

    let myPosition = myAlphabet.indexOf(myLower)

    // Skip spaces, numbers and punctuation
    if (myPosition !== -1) {

      let myKeyLetter = myKey[myKeyLoop % myKey.length]
      let myShift = myAlphabet.indexOf(myKeyLetter)

      // Forward for encrypt, backward for decrypt
      let myNewPosition =
        (myPosition + myDirection * myShift + 26) % 26

      let myTemp = myAlphabet[myNewPosition]

      // Keep uppercase letters
      if (myOriginal !== myLower) {
        myTemp = myTemp.toUpperCase()
      }

      myString[myLoop] = myTemp

      myKeyLoop++
    }
  }

  return myString.join('')
}


function myKeywordEncrypt() {

  let myText = document.getElementById('myArea01').value

  let myResult = myKeywordChange(myText, 1)

  if (myResult !== null) {
    document.getElementById('myArea02').value = myResult
    document.getElementById('myArea03').value = ''
  }

}


function myKeywordDecrypt() {

  let myText = document.getElementById('myArea02').value

  let myResult = myKeywordChange(myText, -1)

  if (myResult !== null) {
    document.getElementById('myArea03').value = myResult
  }

}

</script>
