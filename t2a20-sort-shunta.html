
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>T2A20 Sort by Shunta</title>
</head>
<body>

<h1 align="center">t2a20-sort-shunta.html</h1>

<script>
// Teacher's original variables
let myMax = 52;  // Use 3 for testing, 52 for the assignment
let myCards = new Array(myMax);

// NEW: Save the original numbers
let myOriginalCards = [];
let myComparisons = 0;


// NEW: Start each sort with the same numbers
function myStartSort() {

    if (myOriginalCards.length === 0) {
        document.getElementById('myDiv01').innerHTML =
            'Click Set Random first.';
        return false;
    }

    myCards = myOriginalCards.slice();
    myComparisons = 0;

    return true;
}


// NEW: Display sorting results
function myShowResult(myMethod) {

    let myTemp = '<b>' + myMethod + '</b><br>';

    myTemp += 'Before: ' +
        myOriginalCards.join(', ') + '<br>';

    myTemp += 'After: ' +
        myCards.join(', ') + '<br>';

    myTemp += 'Comparisons: ' +
        myComparisons + '<br><br>';

    for (let myLoop = 0; myLoop < myMax; myLoop++) {

        myTemp += myLoop + ' = ' +
            myCards[myLoop] + '<br>';
    }

    document.getElementById('myDiv01').innerHTML =
        myTemp;
}


// BASIC SORT: Bubble Sort
function myBubbleSort() {

    if (!myStartSort()) return;

    for (let myPass = 0;
         myPass < myMax - 1;
         myPass++) {

        let mySwapped = false;

        for (let myLoop = 0;
             myLoop < myMax - 1 - myPass;
             myLoop++) {

            myComparisons++;

            if (myCards[myLoop] >
                myCards[myLoop + 1]) {

                let myTemp = myCards[myLoop];

                myCards[myLoop] =
                    myCards[myLoop + 1];

                myCards[myLoop + 1] = myTemp;

                mySwapped = true;
            }
        }

        if (!mySwapped) break;
    }

    myShowResult('Bubble Sort');
}


// NEW METHOD 1: Selection Sort
function mySelectionSort() {

    if (!myStartSort()) return;

    for (let myLoop = 0;
         myLoop < myMax - 1;
         myLoop++) {

        let mySmallest = myLoop;

        for (let myNext = myLoop + 1;
             myNext < myMax;
             myNext++) {

            myComparisons++;

            if (myCards[myNext] <
                myCards[mySmallest]) {

                mySmallest = myNext;
            }
        }

        if (mySmallest !== myLoop) {

            let myTemp = myCards[myLoop];

            myCards[myLoop] =
                myCards[mySmallest];

            myCards[mySmallest] = myTemp;
        }
    }

    myShowResult('Selection Sort');
}


// NEW METHOD 2: Insertion Sort
function myInsertionSort() {

    if (!myStartSort()) return;

    for (let myLoop = 1;
         myLoop < myMax;
         myLoop++) {

        let myTemp = myCards[myLoop];
        let myPosition = myLoop - 1;

        while (myPosition >= 0) {

            myComparisons++;

            if (myCards[myPosition] > myTemp) {

                myCards[myPosition + 1] =
                    myCards[myPosition];

                myPosition--;

            } else {
                break;
            }
        }

        myCards[myPosition + 1] = myTemp;
    }

    myShowResult('Insertion Sort');
}


// NEW METHOD 3: Quick Sort
function myQuickSortPart(myLeft, myRight) {

    if (myLeft >= myRight) return;

    let myPivot =
        myCards[Math.floor((myLeft + myRight) / 2)];

    let mySmaller = myLeft;
    let myLoop = myLeft;
    let myLarger = myRight;

    while (myLoop <= myLarger) {

        myComparisons++;

        if (myCards[myLoop] < myPivot) {

            let myTemp = myCards[mySmaller];

            myCards[mySmaller] = myCards[myLoop];
            myCards[myLoop] = myTemp;

            mySmaller++;
            myLoop++;

        } else {

            myComparisons++;

            if (myCards[myLoop] > myPivot) {

                let myTemp = myCards[myLarger];

                myCards[myLarger] = myCards[myLoop];
                myCards[myLoop] = myTemp;

                myLarger--;

            } else {
                myLoop++;
            }
        }
    }

    myQuickSortPart(myLeft, mySmaller - 1);
    myQuickSortPart(myLarger + 1, myRight);
}


function myQuickSort() {

    if (!myStartSort()) return;

    myQuickSortPart(0, myMax - 1);

    myShowResult('Quick Sort');
}


// NEW METHOD 4: Merge Sort
function myMerge(myLeft, myMiddle, myRight) {

    let myTemp = [];

    let myA = myLeft;
    let myB = myMiddle + 1;

    while (myA <= myMiddle &&
           myB <= myRight) {

        myComparisons++;

        if (myCards[myA] <= myCards[myB]) {

            myTemp.push(myCards[myA]);
            myA++;

        } else {

            myTemp.push(myCards[myB]);
            myB++;
        }
    }

    while (myA <= myMiddle) {

        myTemp.push(myCards[myA]);
        myA++;
    }

    while (myB <= myRight) {

        myTemp.push(myCards[myB]);
        myB++;
    }

    for (let myLoop = 0;
         myLoop < myTemp.length;
         myLoop++) {

        myCards[myLeft + myLoop] =
            myTemp[myLoop];
    }
}


function myMergeSortPart(myLeft, myRight) {

    if (myLeft >= myRight) return;

    let myMiddle =
        Math.floor((myLeft + myRight) / 2);

    myMergeSortPart(myLeft, myMiddle);

    myMergeSortPart(myMiddle + 1, myRight);

    myMerge(myLeft, myMiddle, myRight);
}


function myMergeSort() {

    if (!myStartSort()) return;

    myMergeSortPart(0, myMax - 1);

    myShowResult('Merge Sort');
}

</script>


<!-- Teacher's original Set Random button -->

<input type="button" value="Set Random" onclick="{

    for (let myLoop = 0;
         myLoop < myMax;
         myLoop++) {

        myCards[myLoop] =
            Math.floor(Math.random() * 10);
    }

    myOriginalCards = myCards.slice();

    document.getElementById('myDiv01').innerHTML =
        'Random numbers created. Click Show.';

}">


<!-- Teacher's original Show button -->

<input type="button" value="Show" onclick="{

    if (myOriginalCards.length === 0) {

        document.getElementById('myDiv01').innerHTML =
            'Click Set Random first.';

    } else {

        let myTemp = '';

        for (let myLoop = 0;
             myLoop < myMax;
             myLoop++) {

            myTemp += myLoop + ' = ' +
                myCards[myLoop] + '<br>';
        }

        document.getElementById('myDiv01').innerHTML =
            myTemp;
    }

}">


<!-- Teacher's Sort button: Bubble Sort -->

<input type="button" value="Sort"
       onclick="myBubbleSort()">


<!-- NEW: Additional sorting methods -->

<input type="button" value="Selection Sort"
       onclick="mySelectionSort()">

<input type="button" value="Insertion Sort"
       onclick="myInsertionSort()">

<input type="button" value="Quick Sort"
       onclick="myQuickSort()">

<input type="button" value="Merge Sort"
       onclick="myMergeSort()">


<div id="myDiv01"></div>

</body>
</html>
