<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>T2A20 Sort by Shunta</title>
</head>

<body>

<h1 align="center">t2a20-sort-shunta.html</h1>

<h2>Sorting Numbers Using Arrays</h2>

<p>
This program uses Bubble Sort to put random numbers
in order from smallest to largest.
It compares two numbers and swaps them if needed.
The process repeats until the array is sorted.
</p>

<script>

// Global variables
let myMax = 5;
let myCards = new Array(myMax);
let myHasNumbers = false;


// Create random numbers
function mySetRandom() {

  for (let myLoop = 0; myLoop < myMax; myLoop++) {
    myCards[myLoop] = Math.floor(Math.random() * 10);
  }

  myHasNumbers = true;
  myShow();
}


// Show the array
function myShow() {

  if (!myHasNumbers) {
    document.getElementById('myDiv01').innerHTML =
      'Click Set Random first.';
    return;
  }

  let myTemp = '';

  for (let myLoop = 0; myLoop < myMax; myLoop++) {
    myTemp += myLoop + ' = ' +
      myCards[myLoop] + '<br>';
  }

  document.getElementById('myDiv01').innerHTML =
    '<h3>Current Array</h3>' + myTemp;
}


// Sort the array using Bubble Sort
function mySort() {

  if (!myHasNumbers) {
    document.getElementById('myDiv01').innerHTML =
      'Click Set Random first.';
    return;
  }

  let myBefore = myCards.join(', ');
  let myComparisons = 0;
  let mySwaps = 0;

  // Outer loop: repeat the sorting passes
  for (let myPass = 0; myPass < myMax - 1; myPass++) {

    // Inner loop: compare neighboring numbers
    for (let myLoop = 0;
         myLoop < myMax - 1 - myPass;
         myLoop++) {

      myComparisons++;

      // Swap if the left number is bigger
      if (myCards[myLoop] > myCards[myLoop + 1]) {

        let myTemp = myCards[myLoop];

        myCards[myLoop] = myCards[myLoop + 1];

        myCards[myLoop + 1] = myTemp;

        mySwaps++;
      }

    }

  }

  // Display results
  document.getElementById('myDiv01').innerHTML =
    '<h3>Sorting Results</h3>' +
    'Before: ' + myBefore + '<br>' +
    'After: ' + myCards.join(', ') + '<br><br>' +
    'Comparisons: ' + myComparisons + '<br>' +
    'Swaps: ' + mySwaps;

}

</script>


<input type="button"
       value="Set Random"
       onclick="mySetRandom()">

<input type="button"
       value="Show"
       onclick="myShow()">

<input type="button"
       value="Sort"
       onclick="mySort()">

<br><br>

<div id="myDiv01">
  Click Set Random to begin.
</div>

</body>
</html>
