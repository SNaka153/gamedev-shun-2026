<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>T2A18 Game Template by Shunta</title>

    <style>
        #myGameArea {
            position: relative;
            width: 100%;
            max-width: 900px;
            height: 380px;
            border: 3px solid darkgreen;
            margin-top: 20px;
            overflow: hidden;
        }
    </style>
</head>

<body id="myBody"
      style="background-image:url('myBackground01.jpg');
             background-repeat:repeat;
             background-size:80%;">

<h1 align="center">t2a18-game-template-shunta</h1>

<p>Use WASD or Arrow Keys to move the blue slime.</p>
<p>Avoid the red slime!</p>
<p>Collect the small blue slime. Avoid the small red obstacle.</p>

<p id="myStatus">Score: 0 | Lives: 3</p>

<script>

// Global variables
let myGlobalX = 0;
let myClock;

// NEW: Score and lives
let myScore = 0;
let myLives = 3;


// NEW: Update the score and lives display
function myUpdateStatus() {

    document.getElementById('myStatus').textContent =
        'Score: ' + myScore +
        ' | Lives: ' + myLives;
}


// Teacher's collision detection function
function myHitOther(my1, my2) {

    const img1 = document.getElementById(my1);
    const img2 = document.getElementById(my2);

    const left1 = parseInt(img1.style.left);
    const right1 = left1 + parseInt(img1.style.width);
    const top1 = parseInt(img1.style.top);
    const bottom1 = top1 + parseInt(img1.style.height);

    const left2 = parseInt(img2.style.left);
    const right2 = left2 + parseInt(img2.style.width);
    const top2 = parseInt(img2.style.top);
    const bottom2 = top2 + parseInt(img2.style.height);

    if (right1 >= left2 &&
        bottom1 >= top2 &&
        left1 <= right2 &&
        top1 <= bottom2) {

        return true;
    }

    return false;
}


// NEW: Move the player back to the start
function myResetPlayer() {

    document.getElementById('myImg01').style.left = '50px';
    document.getElementById('myImg01').style.top = '140px';
}


// Check collisions
function myCheckHit() {

    // Original: Enemy collision
    if (myHitOther('myImg01', 'myImg02')) {

        alert('You Lose! Try Again.');

        myResetPlayer();

        return;
    }


    // NEW: Collect an item
    if (
        document.getElementById('myImg03').style.display !== 'none' &&
        myHitOther('myImg01', 'myImg03')
    ) {

        // Increase score
        myScore++;

        // Hide the collected item
        document.getElementById('myImg03').style.display = 'none';

        // Update the score
        myUpdateStatus();

    }


    // NEW: Hit an obstacle
    if (myHitOther('myImg01', 'myImg04')) {

        // Decrease lives
        myLives--;

        // Update the lives display
        myUpdateStatus();

        // Return player to the start
        myResetPlayer();

        // Check for game over
        if (myLives <= 0) {

            alert('Game Over! Press Restart Game.');

        }

        return;
    }

}


// Move player inside the game area
function myMovePlayer(x, y) {

    // Stop movement after game over
    if (myLives <= 0) {
        return;
    }

    const player = document.getElementById('myImg01');
    const gameArea = document.getElementById('myGameArea');

    let newX = parseInt(player.style.left) + x;
    let newY = parseInt(player.style.top) + y;

    // Prevent moving outside the game area
    newX = Math.max(
        0,
        Math.min(
            newX,
            gameArea.clientWidth - player.offsetWidth
        )
    );

    newY = Math.max(
        0,
        Math.min(
            newY,
            gameArea.clientHeight - player.offsetHeight
        )
    );

    player.style.left = newX + 'px';
    player.style.top = newY + 'px';

    // Check all collisions after moving
    myCheckHit();
}


// NEW: Restart the game
function myRestartGame() {

    // Reset score and lives
    myScore = 0;
    myLives = 3;

    // Bring back the collectible item
    document.getElementById('myImg03').style.display = 'block';

    // Reset player position
    myResetPlayer();

    // Update status display
    myUpdateStatus();
}


// WASD and Arrow Key controls
document.addEventListener('keydown', function(event) {

    const key = event.key.toLowerCase();

    if (key === 'w' || key === 'arrowup') {
        event.preventDefault();
        myMovePlayer(0, -10);
    }

    if (key === 's' || key === 'arrowdown') {
        event.preventDefault();
        myMovePlayer(0, 10);
    }

    if (key === 'a' || key === 'arrowleft') {
        event.preventDefault();
        myMovePlayer(-10, 0);
    }

    if (key === 'd' || key === 'arrowright') {
        event.preventDefault();
        myMovePlayer(10, 0);
    }

});

</script>


<!-- Original: Background movement -->
<input type="button"
       value="Auto Background Left"
       onclick="{
           clearInterval(myClock);

           myClock = setInterval(function() {

               myGlobalX -= 5;

               document.getElementById('myBody')
                   .style.backgroundPosition =
                   myGlobalX + 'px 0px';

           }, 100);
       }">


<!-- Stop background -->
<input type="button"
       value="Stop Background"
       onclick="clearInterval(myClock)">


<!-- Original: Move right -->
<input type="button"
       value="Image Right Fast Button"
       onclick="myMovePlayer(10, 0)">


<!-- NEW: Restart button -->
<input type="button"
       value="Restart Game"
       onclick="myRestartGame()">

<br><br>


<!-- Game Area -->
<div id="myGameArea">

    <!-- Original: Player -->
    <img id="myImg01"
         src="myImage01.png"
         style="position:absolute;
                width:100px;
                height:80px;
                top:140px;
                left:50px;">


    <!-- Original: Enemy -->
    <img id="myImg02"
         src="myImage02.png"
         style="position:absolute;
                width:100px;
                height:80px;
                top:140px;
                left:250px;">


    <!-- NEW: Collectible item -->
    <img id="myImg03"
         src="myImage01.png"
         style="position:absolute;
                width:70px;
                height:60px;
                top:30px;
                left:175px;">


    <!-- NEW: Obstacle -->
    <img id="myImg04"
         src="myImage02.png"
         style="position:absolute;
                width:70px;
                height:60px;
                top:265px;
                left:470px;">

</div>

</body>
</html>
