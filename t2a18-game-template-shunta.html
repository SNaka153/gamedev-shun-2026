<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>T2A18 Game Template by Shunta</title>

    <style>
        #myGameArea {
            position: relative;
            width: 100%;
            max-width: 900px;
            height: 380px;
            border: 3px solid darkgreen;
            margin-top: 20px;
            overflow: hidden;
        }
    </style>
</head>

<body id="myBody"
      style="background-image:url('myBackground01.jpg');
             background-repeat:repeat;
             background-size:80%;">

<h1 align="center">t2a18-game-template-shunta</h1>

<p>Use WASD or Arrow Keys to move the blue slime.</p>
<p>Avoid the red slimes and collect the small blue slime.</p>
<p>Collect the item before reaching GOAL!</p>

<p id="myStatus">Score: 0 | Lives: 3</p>

<p id="myMessage">
    Collect the blue item, then reach GOAL!
</p>

<script>

// Global variables
let myGlobalX = 0;
let myClock;


// NEW: Game variables
let myScore = 0;
let myLives = 3;
let myHasWon = false;


// NEW: Update score and lives
function myUpdateStatus() {

    document.getElementById('myStatus').textContent =
        'Score: ' + myScore +
        ' | Lives: ' + myLives;
}


// Teacher's collision detection function
function myHitOther(my1, my2) {

    const img1 = document.getElementById(my1);
    const img2 = document.getElementById(my2);

    const left1 = parseInt(img1.style.left);
    const right1 = left1 + parseInt(img1.style.width);
    const top1 = parseInt(img1.style.top);
    const bottom1 = top1 + parseInt(img1.style.height);

    const left2 = parseInt(img2.style.left);
    const right2 = left2 + parseInt(img2.style.width);
    const top2 = parseInt(img2.style.top);
    const bottom2 = top2 + parseInt(img2.style.height);

    if (right1 >= left2 &&
        bottom1 >= top2 &&
        left1 <= right2 &&
        top1 <= bottom2) {

        return true;
    }

    return false;
}


// NEW: Reset player position
function myResetPlayer() {

    document.getElementById('myImg01').style.left = '50px';
    document.getElementById('myImg01').style.top = '140px';
}


// Check collisions
function myCheckHit() {

    // Original: Hit the enemy
    if (myHitOther('myImg01', 'myImg02')) {

        alert('You Lose! Try Again.');

        myResetPlayer();

        document.getElementById('myMessage').textContent =
            'Avoid the red slime!';

        return;
    }


    // NEW: Collect the blue item
    if (
        document.getElementById('myImg03').style.display !== 'none' &&
        myHitOther('myImg01', 'myImg03')
    ) {

        // Increase the score
        myScore++;

        // Remove the collected item
        document.getElementById('myImg03').style.display =
            'none';

        myUpdateStatus();

        document.getElementById('myMessage').textContent =
            'Item collected! Now reach GOAL!';
    }


    // NEW: Hit the obstacle
    if (myHitOther('myImg01', 'myImg04')) {

        // Lose one life
        myLives--;

        myUpdateStatus();

        // Return to starting position
        myResetPlayer();

        if (myLives <= 0) {

            document.getElementById('myMessage').textContent =
                'GAME OVER! Press Restart Game.';

            clearInterval(myClock);
            myClock = null;

            alert('Game Over!');

        } else {

            document.getElementById('myMessage').textContent =
                'Obstacle hit! Lives remaining: ' + myLives;

        }

        return;
    }


    // NEW: Check if the player reaches GOAL
    if (myHitOther('myImg01', 'myGoal')) {

        // The player must collect the item first
        if (myScore >= 1) {

            myHasWon = true;

            document.getElementById('myMessage').textContent =
                'YOU WIN! You collected the item and reached GOAL!';

            // Stop background movement
            clearInterval(myClock);
            myClock = null;

        } else {

            document.getElementById('myMessage').textContent =
                'Collect the blue item before reaching GOAL!';

        }

        return;
    }

}


// Move player inside the game area
function myMovePlayer(x, y) {

    // Stop movement after winning or losing
    if (myLives <= 0 || myHasWon) {
        return;
    }

    const player = document.getElementById('myImg01');
    const gameArea = document.getElementById('myGameArea');

    let newX = parseInt(player.style.left) + x;
    let newY = parseInt(player.style.top) + y;

    // Prevent moving outside the game area
    newX = Math.max(
        0,
        Math.min(
            newX,
            gameArea.clientWidth - player.offsetWidth
        )
    );

    newY = Math.max(
        0,
        Math.min(
            newY,
            gameArea.clientHeight - player.offsetHeight
        )
    );

    player.style.left = newX + 'px';
    player.style.top = newY + 'px';

    // Check collisions after every movement
    myCheckHit();
}


// NEW: Restart the game
function myRestartGame() {

    // Reset game variables
    myScore = 0;
    myLives = 3;
    myHasWon = false;

    // Bring the collectible item back
    document.getElementById('myImg03').style.display =
        'block';

    // Reset player
    myResetPlayer();

    // Reset background movement
    clearInterval(myClock);
    myClock = null;
    myGlobalX = 0;

    document.getElementById('myBody')
        .style.backgroundPosition = '0px 0px';

    // Reset display
    myUpdateStatus();

    document.getElementById('myMessage').textContent =
        'Collect the blue item, then reach GOAL!';
}


// WASD and Arrow Key controls
document.addEventListener('keydown', function(event) {

    const key = event.key.toLowerCase();

    if (key === 'w' || key === 'arrowup') {
        event.preventDefault();
        myMovePlayer(0, -10);
    }

    if (key === 's' || key === 'arrowdown') {
        event.preventDefault();
        myMovePlayer(0, 10);
    }

    if (key === 'a' || key === 'arrowleft') {
        event.preventDefault();
        myMovePlayer(-10, 0);
    }

    if (key === 'd' || key === 'arrowright') {
        event.preventDefault();
        myMovePlayer(10, 0);
    }

});

</script>


<!-- Original: Background movement -->
<input type="button"
       value="Auto Background Left"
       onclick="{
           clearInterval(myClock);

           myClock = setInterval(function() {

               myGlobalX -= 5;

               document.getElementById('myBody')
                   .style.backgroundPosition =
                   myGlobalX + 'px 0px';

           }, 100);
       }">


<!-- Stop background -->
<input type="button"
       value="Stop Background"
       onclick="{
           clearInterval(myClock);
           myClock = null;
       }">


<!-- Original: Move right -->
<input type="button"
       value="Image Right Fast Button"
       onclick="myMovePlayer(10, 0)">


<!-- NEW: Restart button -->
<input type="button"
       value="Restart Game"
       onclick="myRestartGame()">

<br><br>


<!-- Game Area -->
<div id="myGameArea">

    <!-- Original: Player -->
    <img id="myImg01"
         src="myImage01.png"
         style="position:absolute;
                width:100px;
                height:80px;
                top:140px;
                left:50px;">


    <!-- Original: Enemy -->
    <img id="myImg02"
         src="myImage02.png"
         style="position:absolute;
                width:100px;
                height:80px;
                top:140px;
                left:250px;">


    <!-- NEW: Collectible item -->
    <img id="myImg03"
         src="myImage01.png"
         style="position:absolute;
                width:70px;
                height:60px;
                top:30px;
                left:175px;">


    <!-- NEW: Obstacle -->
    <img id="myImg04"
         src="myImage02.png"
         style="position:absolute;
                width:70px;
                height:60px;
                top:265px;
                left:470px;">


    <!-- NEW: GOAL -->
    <div id="myGoal"
         style="position:absolute;
                width:80px;
                height:60px;
                top:30px;
                left:350px;
                background-color:lightgreen;
                border:2px solid green;
                box-sizing:border-box;
                text-align:center;
                line-height:56px;
                font-weight:bold;">

        GOAL

    </div>

</div>

</body>
</html>
